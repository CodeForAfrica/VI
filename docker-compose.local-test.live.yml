# Loaded only when the operator supplies AWS_PROFILE and/or OPENROUTER_API_KEY.
services:
  dashboard:
    networks: [providers]
    environment:
      VI_LOCAL_AWS_LIVE: ${VI_LOCAL_AWS_LIVE:?set by the local runner}
      VI_LOCAL_OPENROUTER_LIVE: ${VI_LOCAL_OPENROUTER_LIVE:?set by the local runner}
      AWS_REGION_NAME: ${AWS_REGION:-eu-west-1}
    secrets: [local_aws_credentials, local_openrouter_key]
  browser:
    environment:
      VI_LOCAL_AWS_LIVE: ${VI_LOCAL_AWS_LIVE:?set by the local runner}
      VI_LOCAL_OPENROUTER_LIVE: ${VI_LOCAL_OPENROUTER_LIVE:?set by the local runner}
secrets:
  local_aws_credentials:
    file: ${VI_LOCAL_CREDENTIALS_DIR:?set by the local runner}/aws.json
  local_openrouter_key:
    file: ${VI_LOCAL_CREDENTIALS_DIR:?set by the local runner}/openrouter.key
networks:
  providers: {}
